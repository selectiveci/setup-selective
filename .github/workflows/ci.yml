name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          api-key: abc123
          runner-id: 1

      - name: Print Output
        id: output
        run: |
          echo "SELECTIVE_RUNNER_ID: $SELECTIVE_RUNNER_ID"

      - name: Plan Without A Reachable Host
        id: plan
        uses: ./plan
        with:
          api-key: abc123
          max-runners: 3
          timeout-seconds: 10
          host: http://127.0.0.1:9

      - name: Check The Fallback
        env:
          RUNNERS: ${{ steps.plan.outputs.runners }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          echo "runners=$RUNNERS matrix=$MATRIX status=$STATUS"
          test "$RUNNERS" = 3 && test "$MATRIX" = "[0,1,2]" && test "$STATUS" = fallback
