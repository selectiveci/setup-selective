name: 'Selective Plan'
description: 'Plans how many test runners a change needs: warms up Selective''s test selection for the commit and outputs a matrix sized to it'
author: 'Selective'

inputs:
  api-key:
    description: 'Your Selective Suite API Key. Without one (as on a pull request from a fork) the plan is max-runners'
  max-runners:
    description: 'The most runners the suite may use; also the plan whenever every test runs'
    required: true
  min-runners:
    description: 'The fewest runners to plan'
    default: '1'
  target-seconds:
    description: 'Seconds of selected tests each runner should get'
    default: '120'
  timeout-seconds:
    description: 'How long to wait for Selective before planning max-runners'
    default: '90'
  host:
    description: 'Selective host. Defaults to SELECTIVE_HOST, then https://app.selective.ci'
  language:
    description: 'Test language (for example ruby). Only needed when the suite records test maps for several environments'
  framework:
    description: 'Test framework (rspec or minitest). Only needed when the suite records test maps for several environments'
  runtime-version:
    description: 'Language version (for example 4.0.7). Only needed when the suite records test maps for several environments'

outputs:
  runners:
    description: 'How many runners to start'
  matrix:
    description: 'A JSON array of runner indices, [0, 1, ...], for strategy.matrix'
  status:
    description: 'selected (sized to the selection), full (every test runs), or fallback (no answer; max-runners)'

runs:
  using: node24
  main: '../dist/plan/index.js'
